name: Source checks
on: [push, pull_request]
jobs:
  checks:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m compileall -q addon scripts tests
      - run: node --check web/app.js && node --check web/overview.js && node --check web/projects.js && node --check web/welcome.js
      - run: node scripts/test_web_controls.cjs
      - run: python -m unittest discover -s tests -p test_briefs.py
      - run: python -m unittest discover -s tests -p test_platform.py
      - run: python scripts/package_release.py --platform all
